# 約束は tools/docs-check/test/dependabot.test.ts で固定する。理由は docs/architecture/operations.md の「Dependabot での更新」にある
version: 2
updates:
  # lock に載っている workflow なら、actions.lock も同じ PR で更新される。ここに設定は要らない
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # PR の題名が main のコミットになるので、commitlint を通す形にする。include: scope は書かない（ci(deps): になる）
    commit-message:
      prefix: ci
    cooldown:
      default-days: 3
    # major は入れない。release-please.yaml と deploy.yaml は PR の CI で動かないので、壊れる更新を action ごとに切り分ける
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  # .mise.toml（node・pnpm など）は Dependabot が読まないので、手で更新する
  - package-ecosystem: npm
    # pnpm-lock.yaml は root に1つだけなので、/ だけを指す
    directory: /
    schedule:
      interval: weekly
    # chore は CHANGELOG に載らず、版も上がらない。include: scope は書かない（chore(deps): になる）
    commit-message:
      prefix: chore
    # pnpm の公開待ち期間（1日）より長くする。推移的な依存には効かない
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      # 8 系では、React Compiler が既定値付き props の部品を黙って飛ばす
      - dependency-name: '@babel/core'
        update-types: [version-update:semver-major]
      # .mise.toml の Node の版に合わせて、手で上げる
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # 7.0 には API がない。7.1 が出たら、この ignore を外す
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    # 先に一致したグループに入るので、minor-and-patch は最後に書く
    groups:
      # 版をそろえるものは、major のときだけ一緒に別の PR にする
      storybook:
        patterns: ['storybook', '@storybook/*']
        update-types: [major]
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [major]
      tailwindcss:
        patterns: ['tailwindcss', '@tailwindcss/*']
        update-types: [major]
      commitlint:
        patterns: ['@commitlint/*']
        update-types: [major]
      # ほかの major はどのグループにも入らず、パッケージごとの PR になる
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
